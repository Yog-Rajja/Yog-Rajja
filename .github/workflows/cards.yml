name: Refresh profile cards

# Rebuilds assets/*.svg from live GitHub data every day.
# Needs a PROFILE_TOKEN secret (a token that can read your private repos). Without it the job
# skips rather than overwrite the cards with a public-only language breakdown.

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a token
        id: token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -n "$PROFILE_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No PROFILE_TOKEN secret, so the cards were left as they are."; fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v7
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24

      - name: Build cards
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build-cards.mjs

      - name: Commit if anything changed
        if: steps.token.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
